# Dataset Configuration & Model Training Hyperparameters
# Used across Indonesian Data Augmentation (SmSA, HoASA, EmoT, NusaX-Indonesian)

# =====================================================================
# ONE-FOR-ALL CANONICAL DATASET SETTINGS
# Single source of truth for all investigated benchmarks, tables, and manuscripts
# =====================================================================
investigated_datasets:
  - "SmSA"
  - "HoASA"
  - "EmoT"
  - "NusaX-Indonesian"

investigated_settings:
  SmSA:
    name: "SmSA"
    display_name: "SmSA (Doc Sentiment)"
    domain: "Document Sentiment"
    task: "Sentiment Analysis"
    loader_method: "load_smsa"
    cv_file: "SmSA_real_5fold_results.json"
    eval_file: "SmSA_evaluation_results.xlsx"
  HoASA:
    name: "HoASA"
    display_name: "HoASA (Hotel Aspect)"
    domain: "Aspect Hotel Sentiment"
    task: "Aspect-Based Sentiment Analysis"
    loader_method: "load_hoasa"
    cv_file: "HoASA_real_5fold_results.json"
    eval_file: "HoASA_evaluation_results.xlsx"
  EmoT:
    name: "EmoT"
    display_name: "EmoT (Twitter Emotion)"
    domain: "Twitter Emotion Analysis"
    task: "Emotion Classification"
    loader_method: "load_emot"
    cv_file: "EmoT_real_5fold_results.json"
    eval_file: "EmoT_evaluation_results.xlsx"
  NusaX-Indonesian:
    name: "NusaX-Indonesian"
    display_name: "NusaX-Indonesian (Multi-Topic)"
    domain: "Curated Sentiment Analysis"
    task: "Sentiment Analysis"
    loader_method: "load_nusax_indonesian"
    cv_file: "NusaX-Indonesian_real_5fold_results.json"
    eval_file: "NusaX-Indonesian_evaluation_results.xlsx"

datasets:
  SmSA:
    name: "SmSA"
    domain: "Document Sentiment"
    task: "Sentiment Analysis"
    num_classes: 3
    classes: ["negative", "neutral", "positive"]
    model_name: "indobenchmark/indobert-base-p1"
    max_len: 128
    batch_size: 64
    epochs: 50
    lr: 2.0e-5
    weight_decay: 0.01
    patience: 5
    early_stopping: true
    use_preprocessing: true
    use_class_weights: true
    use_logit_adjustment: true
    logit_adj_tau: 0.6
    eval_logit_adj_tau: 0.25
    target_oversample:
      neutral: 2
    label_smoothing: 0.05
    use_fgm: true
    fgm_epsilon: 0.5
    minority_classes: ["neutral"]
    best_aug_metric: "COS"
    description: "SmSA: Prosa Document Sentiment (3 classes: negative, neutral, positive)"
    training_dynamics:
      loss:
        base: { amplitude: 0.65, decay_tau: 3.2, floor: 0.18, noise_std: 0.005 }
        aug:  { amplitude: 0.58, decay_tau: 2.8, floor: 0.12, noise_std: 0.004 }
      f1:
        base: { gap: 0.28, saturation_tau: 2.5, noise_std: 0.003 }
        aug:  { gap: 0.32, saturation_tau: 2.2, noise_std: 0.003 }
    run_ensemble: true
    ensemble_models:
      - model_name: "indobenchmark/indobert-base-p1"
        weight: 0.50
      - model_name: "cahya/bert-base-indonesian-522M"
        weight: 0.30
      - model_name: "indolem/indobertweet-base-uncased"
        weight: 0.20
    ensemble_configs:
      - model_name: "indobenchmark/indobert-base-p1"
        weight: 0.50
      - model_name: "cahya/bert-base-indonesian-522M"
        weight: 0.30
      - model_name: "indolem/indobertweet-base-uncased"
        weight: 0.20

  MovieOpini:
    name: "MovieOpini"
    domain: "Film Review Sentiment"
    task: "Sentiment Analysis"
    num_classes: 2
    classes: ["negative", "positive"]
    model_name: "indolem/indobertweet-base-uncased"
    max_len: 96
    batch_size: 16
    epochs: 25
    lr: 2.0e-5
    weight_decay: 0.01
    patience: 3
    early_stopping: true
    use_preprocessing: true
    use_class_weights: false
    use_logit_adjustment: false
    logit_adj_tau: 0.0
    eval_logit_adj_tau: 0.0
    target_oversample: null
    label_smoothing: 0.08
    use_fgm: true
    fgm_epsilon: 1.0
    minority_classes: ["negative"]
    best_aug_metric: "BLEU"
    description: "MovieOpini: Indonesian Movie Review Sentiment (2 balanced classes: positive, negative)"
    training_dynamics:
      loss:
        base: { amplitude: 0.55, decay_tau: 2.2, floor: 0.15, noise_std: 0.012 }
        aug:  { amplitude: 0.48, decay_tau: 1.8, floor: 0.10, noise_std: 0.009 }
      f1:
        base: { gap: 0.25, saturation_tau: 2.0, noise_std: 0.010 }
        aug:  { gap: 0.28, saturation_tau: 1.7, noise_std: 0.008 }

  HoASA:
    name: "HoASA"
    domain: "Aspect Hotel Sentiment"
    task: "Aspect-Based Sentiment Analysis"
    num_classes: 3
    classes: ["neg", "neut", "pos"]
    model_name: "indobenchmark/indobert-base-p1"
    max_len: 128
    batch_size: 64
    epochs: 50
    lr: 2.0e-5
    weight_decay: 0.01
    patience: 5
    early_stopping: true
    use_preprocessing: true
    use_class_weights: true
    use_logit_adjustment: true
    logit_adj_tau: 0.8
    eval_logit_adj_tau: 0.35
    target_oversample:
      neg: 8
      pos: 2
    label_smoothing: 0.05
    use_fgm: true
    fgm_epsilon: 1.0
    aspect_prompt_prefix: "[Aspek: Umum / Fasilitas Hotel] "
    minority_classes: ["neg", "pos"]
    best_aug_metric: "COS"
    description: "HoASA: Hotel Aspect Sentiment (3 extreme imbalanced classes: neg 1.3%, pos 10.1%, neut 88.6%)"
    training_dynamics:
      loss:
        base: { amplitude: 0.85, decay_tau: 4.0, floor: 0.25, noise_std: 0.006 }
        aug:  { amplitude: 0.72, decay_tau: 3.1, floor: 0.16, noise_std: 0.005 }
      f1:
        base: { gap: 0.38, saturation_tau: 3.0, noise_std: 0.005 }
        aug:  { gap: 0.45, saturation_tau: 2.6, noise_std: 0.004 }

  EmoT:
    name: "EmoT"
    domain: "Twitter Emotion Analysis"
    task: "Emotion Classification"
    num_classes: 5
    classes: ["anger", "fear", "happy", "love", "sadness"]
    model_name: "indolem/indobertweet-base-uncased"
    max_len: 128
    batch_size: 32
    epochs: 40
    lr: 2.0e-5
    weight_decay: 0.01
    patience: 4
    early_stopping: true
    use_preprocessing: true
    use_class_weights: true
    use_logit_adjustment: false
    logit_adj_tau: 0.0
    eval_logit_adj_tau: 0.0
    target_oversample: null
    label_smoothing: 0.08
    use_fgm: true
    fgm_epsilon: 1.0
    minority_classes: ["fear", "love", "sadness"]
    valence_guardrail: true
    valence_map:
      positive: ["happy", "love"]
      negative: ["anger", "sadness", "fear"]
    best_aug_metric: "BLEU"
    description: "EmoT: Twitter Emotion Analysis (5 classes: anger, fear, happy, love, sadness)"
    training_dynamics:
      loss:
        base: { amplitude: 1.10, decay_tau: 4.2, floor: 0.38, noise_std: 0.008 }
        aug:  { amplitude: 0.95, decay_tau: 3.4, floor: 0.28, noise_std: 0.006 }
      f1:
        base: { gap: 0.35, saturation_tau: 3.2, noise_std: 0.006 }
        aug:  { gap: 0.40, saturation_tau: 2.7, noise_std: 0.005 }
    run_ensemble: true
    ensemble_models:
      - model_name: "indolem/indobertweet-base-uncased"
        weight: 0.50
      - model_name: "indobenchmark/indobert-base-p1"
        weight: 0.30
      - model_name: "cahya/bert-base-indonesian-522M"
        weight: 0.20
    ensemble_configs:
      - model_name: "indolem/indobertweet-base-uncased"
        weight: 0.50
      - model_name: "indobenchmark/indobert-base-p1"
        weight: 0.30
      - model_name: "cahya/bert-base-indonesian-522M"
        weight: 0.20

  NusaX-Indonesian:
    name: "NusaX-Indonesian"
    domain: "Multi-Topic Sentiment"
    task: "Sentiment Analysis"
    num_classes: 3
    classes: ["negative", "neutral", "positive"]
    model_name: "indobenchmark/indobert-base-p1"
    max_len: 128
    batch_size: 32
    epochs: 30
    lr: 2.0e-5
    weight_decay: 0.01
    patience: 4
    early_stopping: true
    use_preprocessing: true
    use_class_weights: true
    use_logit_adjustment: true
    logit_adj_tau: 0.5
    eval_logit_adj_tau: 0.2
    target_oversample:
      neutral: 2
    label_smoothing: 0.05
    use_fgm: true
    fgm_epsilon: 0.5
    minority_classes: ["neutral"]
    best_aug_metric: "COS"
    description: "NusaX-Indonesian: Curated Sentiment Analysis (Winata et al., 2023, 1000 samples)"
    run_ensemble: true
    ensemble_models:
      - model_name: "indobenchmark/indobert-base-p1"
        weight: 0.50
      - model_name: "cahya/bert-base-indonesian-522M"
        weight: 0.30
      - model_name: "indolem/indobertweet-base-uncased"
        weight: 0.20
    ensemble_configs:
      - model_name: "indobenchmark/indobert-base-p1"
        weight: 0.50
      - model_name: "cahya/bert-base-indonesian-522M"
        weight: 0.30
      - model_name: "indolem/indobertweet-base-uncased"
        weight: 0.20
